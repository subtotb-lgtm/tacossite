<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Game Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #ff66b2; }
        .game-btn {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px;
            background-color: #333;
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #00ffff;
        }
        .game-btn:active {
            background-color: #00ffff;
            color: #121212;
        }
    </style>
</head>
<body>

    <h1>hi let's play games</h1>
    <p>Tap a link to play a game!</p>

    <!-- Replace the '#' with your actual game links later -->
    <a href="https://example.com" class="game-btn">Play Minecraft</a>
    <a href="https://www.youtube.com/" class="game-btn">youtube.com</a>


</body>
</html>
